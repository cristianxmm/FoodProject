<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Comedor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <style>
        body { 
            background: #f4f7f6; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
        }
        .card-login { 
            width: 100%; 
            max-width: 400px; 
            border: none; 
            border-radius: 1rem; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="card card-login shadow-lg p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold">Acceso RH</h3>
                    <p class="text-muted small">Ingresa tus credenciales para continuar</p>
                </div>
                
                <!-- Soporte para mensajes de Flask (Logout, etc.) -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category if category != 'message' else 'info' }} small py-2 mb-3">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <!-- Mensaje de error por mal usuario/contraseña -->
                {% if error %}
                    <div class="alert alert-danger small py-2 mb-3">{{ error }}</div>
                {% endif %}

                <form method="POST" action="{{ url_for('rh.login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-bold">Usuario</label>
                        <input type="text" id="username" name="username" class="form-control" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label small fw-bold">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 fw-bold py-2 mb-3">Entrar al Panel</button>
                    
                    <div class="text-center">
                        <a href="{{ url_for('main.index') }}" class="text-decoration-none small text-muted">← Volver al Kiosco</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
