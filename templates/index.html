<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comedor Empresarial - Kiosco</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-icons.css') }}">
    
    <style>
        body { 
            background-color: #e9ecef; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
        }
        .kiosco-card { 
            max-width: 650px; 
            width: 100%; 
            border-radius: 1.5rem; 
        }
        .logo-empresa { 
            max-height: 120px; 
            object-fit: contain; 
        }
        .barcode-icon {
            font-size: 3.5rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    
    <div class="container px-4">
        <div class="card shadow-lg p-5 text-center kiosco-card mx-auto border-0">
            
            <img src="{{ url_for('static', filename='Logo.png') }}" alt="Logo Empresa" class="logo-empresa mb-4 mx-auto d-block img-fluid" onerror="this.src='https://placehold.co/400x120/ffffff/6c757d?text=LOGO+DE+LA+EMPRESA'">

            <h1 class="mb-2 fw-bold text-dark">Registro de Comedor</h1>
            <p class="text-muted mb-4 fs-5">Por favor, escanea el código de barras de tu gafete.</p>
            
            <!-- INDICADOR VISUAL -->
            <div class="py-3 mb-4 bg-light rounded-4 border">
                <i class="bi bi-qr-code-scan barcode-icon d-block mb-2 text-danger"></i>
                <span class="text-muted fw-bold">Esperando lectura de gafete...</span>
            </div>

            <!-- CONTENEDOR DINÁMICO DE MENSAJES (Escaner via evdev / API) -->
            <div id="alerta-kiosko"></div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
    
    <script>
        let ultimoTimestampProcesado = 0;
        let timerOcultar = null;

        async function verificarEstadoKiosko() {
            try {
                const respuesta = await fetch('/api/kiosko/estado');
                if (!respuesta.ok) return;

                const data = await respuesta.json();

                // Solo mostrar si es un escaneo nuevo (menos de 5 segundos de antigüedad)
                if (data.timestamp > ultimoTimestampProcesado && (Date.now() / 1000 - data.timestamp) < 5) {
                    ultimoTimestampProcesado = data.timestamp;

                    const contenedor = document.getElementById('alerta-kiosko');
                    
                    // Renderizar mensaje de estado según respuesta de evdev
                    contenedor.innerHTML = `
                        <div class="alert alert-${data.tipo} text-center fs-4 fw-bold shadow-sm mb-0 rounded-4 py-3" role="alert">
                            ${data.mensaje}
                        </div>
                    `;

                    // Si escanean rápido, reiniciar el contador para ocultar
                    if (timerOcultar) clearTimeout(timerOcultar);

                    // Ocultar mensaje automáticamente a los 3.5 segundos
                    timerOcultar = setTimeout(() => {
                        contenedor.innerHTML = '';
                    }, 3500);
                }
            } catch (error) {
                console.error("Error consultando el estado del kiosco:", error);
            }
        }

        // Consultar cada 400ms para actualización inmediata tras el escaneo por hardware
        setInterval(verificarEstadoKiosko, 400);
    </script>
</body>
</html>
