<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comedor Empresarial - Kiosco</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-icons.css') }}">
    
    <style>
        body { 
            background-color: #e9ecef; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0; 
        }
        .kiosco-card { 
            max-width: 650px; 
            width: 100%; 
            border-radius: 1.5rem; 
        }
        .logo-empresa { 
            max-height: 120px; 
            object-fit: contain; 
        }
        .barcode-icon {
            font-size: 3.5rem;
            color: #003366;
        }
        .foto-alerta {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ffffff;
        }
    </style>
</head>
<body>
    
    <div class="container px-4">
        <div class="card shadow-lg p-5 text-center kiosco-card mx-auto border-0">
            
            <img src="{{ url_for('static', filename='Logo.png') }}" alt="Logo Empresa" class="logo-empresa mb-4 mx-auto d-block img-fluid" onerror="this.src='https://placehold.co/400x120/ffffff/6c757d?text=LOGO+DE+LA+EMPRESA'">

            <h1 class="mb-2 fw-bold text-dark">Registro de Comedor</h1>
            <p class="text-muted mb-4 fs-5">Por favor, escanea el código de barras de tu gafete.</p>
            
            <!-- INDICADOR VISUAL (ESTADO DE ESPERA) -->
            <div id="indicador-espera" class="py-3 mb-4 bg-light rounded-4 border">
                <i class="bi bi-qr-code-scan barcode-icon d-block mb-2"></i>
                <span class="text-muted fw-bold fs-5">Esperando lectura de gafete...</span>
            </div>

            <!-- ALERTAS NATIVAS DE FLASK (Para envíos por formulario web/resguardo) -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm text-center fs-4 fw-bold mb-3 rounded-4 py-3" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- CONTENEDOR DINÁMICO DE MENSAJES Y FOTO (Hardware evdev / API) -->
            <div id="alerta-kiosko"></div>

        </div>
    </div>
<script>
    let ultimoTimestampProcesado = 0;
    let timerOcultar = null;
    let vocesDisponibles = [];

    // =========================================================
    // 1. CARGA Y SELECCIÓN DE VOZ NATURAL
    // =========================================================
    function cargarVoces() {
        if ('speechSynthesis' in window) {
            vocesDisponibles = window.speechSynthesis.getVoices();
        }
    }

    if ('speechSynthesis' in window) {
        cargarVoces();
        window.speechSynthesis.onvoiceschanged = cargarVoces;
    }

    function seleccionarMejorVozEspanol() {
    if (!vocesDisponibles || vocesDisponibles.length === 0) {
        cargarVoces();
    }

    const vocesEs = vocesDisponibles.filter(v => v.lang && v.lang.toLowerCase().startsWith('es'));
    if (vocesEs.length === 0) return null;

    // Lista negra de variantes robóticas y distorsionadas de Linux / Firefox
    const nombresExcluidos = [
        "universalrobot", "robosoft", "klatt", "croak", "demonic", 
        "whisper", "fast_test", "grandpa", "storm"
    ];

    // Filtra únicamente voces limpias
    const vocesLimpias = vocesEs.filter(v => {
        const nombreMin = v.name.toLowerCase();
        return !nombresExcluidos.some(excluido => nombreMin.includes(excluido));
    });

    // Lista ordenada de preferencia de tus voces instaladas
    const ordenPreferido = [
        "Belinda",   // Español Latinoamericano (Femenina clara)
        "Miguel",    // Español Latinoamericano (Masculina natural)
        "Linda",     // Español Latinoamericano (Femenina)
        "Marcelo",   // Español Latinoamericano (Masculina)
        "Annie",     // Español Latinoamericano (Femenina)
        "Hugo",      // Español Latinoamericano (Masculina)
        "Andrea",    // Español España (Femenina)
        "Pablo",     // Español España (Masculina)
        "Antonio"    // Español España (Masculina)
    ];

    // 1. Buscar según la lista de preferencia
    for (const nombre of ordenPreferido) {
        const coincidencia = vocesLimpias.find(v => v.name.includes(nombre));
        if (coincidencia) return coincidencia;
    }

    // 2. Si no encuentra ninguna de las preferidas, toma la primera limpia
    if (vocesLimpias.length > 0) return vocesLimpias[0];

    // Fallback final
    return vocesEs[0];
}

let reproductorVoz = new Audio();

function hablarMensaje(texto) {
    if (!texto) return;
    
    // Detiene el audio anterior si está reproduciéndose
    reproductorVoz.pause();
    reproductorVoz.currentTime = 0;
    
    // Carga el audio neural generado por el servidor
    reproductorVoz.src = `/api/tts?texto=${encodeURIComponent(texto)}`;
    reproductorVoz.play().catch(e => console.warn("Error reproduciendo voz neural:", e));
}

    // =========================================================
    // 2. EFECTOS DE SONIDO MP3 (OPCIONAL / COMENTADO)
    // =========================================================
    /*
    const efectosSonido = {
        'success': new Audio("{{ url_for('static', filename='audio/success.mp3') }}"),
        'warning': new Audio("{{ url_for('static', filename='audio/warning.mp3') }}"),
        'danger':  new Audio("{{ url_for('static', filename='audio/danger.mp3') }}")
    };
    */

    // =========================================================
    // 3. CONSULTA Y PROCESAMIENTO DE EVENTOS EN TIEMPO REAL
    // =========================================================
    async function verificarEstadoKiosko() {
        try {
            const respuesta = await fetch('/api/kiosko/ultimo_evento');
            if (!respuesta.ok) return;

            const data = await respuesta.json();

            // Validar que exista evento nuevo generado en los últimos 6 segundos
            if (data.timestamp && data.timestamp > ultimoTimestampProcesado && (Date.now() / 1000 - data.timestamp) < 6) {
                ultimoTimestampProcesado = data.timestamp;

                const contenedor = document.getElementById('alerta-kiosko');
                const indicadorEspera = document.getElementById('indicador-espera');
                
                // Ocultar caja de espera mientras se muestra el resultado
                if (indicadorEspera) indicadorEspera.classList.add('d-none');

                // 🔊 Reproducción de voz
                if (data.mensaje) {
                    hablarMensaje(data.mensaje);
                }

                // 🎵 Audio MP3 secundario (si se llega a descomentar)
                /*
                if (efectosSonido[data.tipo]) {
                    efectosSonido[data.tipo].currentTime = 0;
                    efectosSonido[data.tipo].play().catch(e => console.warn("Audio bloqueado:", e));
                }
                */

                // Renderizar notificación visual con la fotografía del empleado
                contenedor.innerHTML = `
                    <div class="alert alert-${data.tipo} text-center shadow-lg mb-0 rounded-4 py-4" role="alert">
                        <img src="${data.foto}?t=${Date.now()}" alt="Foto Empleado" class="foto-alerta shadow-sm mb-3 mx-auto d-block">
                        <div class="fs-3 fw-bold">${data.mensaje}</div>
                    </div>
                `;

                // Reiniciar temporizador si se escanean varios gafetes en secuencia
                if (timerOcultar) clearTimeout(timerOcultar);

                // Restaurar estado de espera tras 4 segundos
                timerOcultar = setTimeout(() => {
                    contenedor.innerHTML = '';
                    if (indicadorEspera) indicadorEspera.classList.remove('d-none');
                }, 4000);
            }
        } catch (error) {
            console.error("Error consultando evento del kiosco:", error);
        }
    }

    // Consulta periódica al endpoint cada 400 ms
    setInterval(verificarEstadoKiosko, 400);
</script>
</body>
</html>
